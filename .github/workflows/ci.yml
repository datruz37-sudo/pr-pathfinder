name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install development tools
        run: python -m pip install "pip==26.2.1" "pytest==9.1.1" "ruff==0.16.6" "build==1.6.0"
      - name: Install package
        run: python -m pip install -e .
      - name: Lint
        run: python -m ruff check .
      - name: Test
        run: python -m pytest
      - name: Self-check contributor path
        run: python -m pr_pathfinder check . --fail-on error
      - name: Build package
        run: python -m build
