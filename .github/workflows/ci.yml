name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install development tools
        run: python -m pip install --upgrade pip pytest ruff build
      - name: Install package
        run: python -m pip install -e .
      - name: Lint
        run: python -m ruff check .
      - name: Test
        run: python -m pytest
      - name: Self-check contributor path
        run: python -m pr_pathfinder check . --fail-on error
      - name: Build package
        run: python -m build
